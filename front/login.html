<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="api-base" content="" />
  <meta name="theme-color" content="#0f9d58" />
  <title>ZelaAi — Entrar</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="description" content="Plataforma de zeladoria pública: reporte, vote e acompanhe ocorrências da sua cidade." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ZelaAi" />
  <meta property="og:title" content="ZelaAi — Sua cidade, sua voz." />
  <meta property="og:description" content="Reporte problemas urbanos, vote no que importa e acompanhe gestões em tempo real." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ZelaAi — Sua cidade, sua voz." />
  <meta name="twitter:description" content="Reporte problemas urbanos, vote no que importa e acompanhe gestões em tempo real." />
  <meta name="twitter:image" content="assets/og-image.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("zelaai.theme")
             || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div class="auth-wrap">
    <a class="auth-hero" href="index.html">
      <span class="brand-mark">Z</span>
      <span>ZelaAi</span>
    </a>

    <div class="auth-top-actions" id="auth-top-actions"></div>

    <div class="auth-card">
      <span class="eyebrow">Plataforma cívica</span>
      <h1>Sua cidade, sua voz.</h1>
      <p class="subtitle">Reporte, vote e acompanhe o que está sendo resolvido.</p>

      <div class="tabs">
        <button id="tab-login" class="active" type="button">Entrar</button>
        <button id="tab-signup" type="button">Cadastrar</button>
      </div>

      <!-- LOGIN -->
      <form id="form-login">
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text" autocomplete="username" required placeholder="seuusuario" />
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button class="btn" type="submit" id="btn-login">Entrar</button>
      </form>

      <!-- SIGNUP -->
      <form id="form-signup" style="display:none;">
        <div class="field">
          <label for="su-name">Nome completo</label>
          <input id="su-name" type="text" required maxlength="100" placeholder="Como te chamamos?" />
        </div>
        <div class="field">
          <label for="su-username">Username</label>
          <input id="su-username" type="text" required maxlength="30" placeholder="único, sem espaços" />
        </div>
        <div class="field">
          <label for="su-password">Senha</label>
          <input id="su-password" type="password" required maxlength="20" placeholder="••••••••" />
          <div class="hint">até 20 caracteres</div>
        </div>
        <div class="field">
          <label for="su-cep">CEP</label>
          <input id="su-cep" type="text" inputmode="numeric" required maxlength="9" placeholder="00000-000" />
          <div class="hint" id="su-cep-hint">vamos puxar sua cidade e estado automaticamente</div>
        </div>
        <button class="btn" type="submit" id="btn-signup">Criar conta</button>
      </form>

      <div style="margin-top:20px;text-align:center;font-size:0.82rem;color:var(--text-muted);">
        ou <a href="index.html" style="font-weight:600;">explorar sem entrar →</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>

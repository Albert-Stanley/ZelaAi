<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="api-base" content="" />
  <meta name="cloudinary-cloud-name"  content="" />
  <meta name="cloudinary-upload-preset" content="" />
  <meta name="theme-color" content="#0f9d58" />
  <title>ZelaAi — Feed</title>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="description" content="Plataforma de zeladoria pública: reporte, vote e acompanhe ocorrências da sua cidade." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ZelaAi" />
  <meta property="og:title" content="ZelaAi — Sua cidade, sua voz." />
  <meta property="og:description" content="Reporte problemas urbanos, vote no que importa e acompanhe gestões em tempo real." />
  <meta property="og:image" content="assets/og-image.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ZelaAi — Sua cidade, sua voz." />
  <meta name="twitter:description" content="Reporte problemas urbanos, vote no que importa e acompanhe gestões em tempo real." />
  <meta name="twitter:image" content="assets/og-image.svg" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("zelaai.theme")
             || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", t);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">Z</span>
        <span>ZelaAi</span>
      </a>
      <nav class="nav-links">
        <a href="index.html" class="active">Feed</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="mandates.html" id="mand-link">Termômetro</a>
        <a href="my.html" id="my-link">Minhas</a>
      </nav>
      <div class="header-actions">
        <span class="user-tag" id="user-tag">…</span>
        <a class="logout" href="#" id="logout-link">sair</a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="content">

      <div class="map-wrap">
        <div id="map"></div>
      </div>

      <div class="search-bar">
        <input id="search" type="search" placeholder="Buscar por título, descrição, cidade ou CEP..." />
      </div>

      <div class="filter-chips" id="status-chips" role="tablist" aria-label="Filtrar por status">
        <button type="button" data-status="all" class="active">Todas</button>
        <button type="button" data-status="open">Abertas</button>
        <button type="button" data-status="in_progress">Em andamento</button>
        <button type="button" data-status="resolved">Resolvidas</button>
      </div>

      <div class="feed-header">
        <h2>Ocorrências</h2>
        <span class="count" id="count">—</span>
      </div>

      <div id="feed">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <button class="fab" id="fab-new" aria-label="Nova ocorrência">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Modal de criação -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2>Nova ocorrência</h2>
      <p class="modal-sub">Conte o que está rolando no seu bairro.</p>
      <form id="form-new">
        <div class="field">
          <label for="oc-category">Categoria</label>
          <select id="oc-category" required></select>
        </div>
        <div class="field">
          <label for="oc-title">Título</label>
          <input id="oc-title" type="text" required maxlength="150" placeholder="Ex: Buraco enorme na Av. Brasil" />
        </div>
        <div class="field">
          <label for="oc-desc">Descrição</label>
          <textarea id="oc-desc" required maxlength="2000" placeholder="Descreva o problema com detalhes…"></textarea>
        </div>
        <div class="field">
          <label>Foto</label>
          <div class="upload-zone" id="oc-drop" tabindex="0" role="button" aria-label="Selecionar foto">
            <div class="upload-preview" id="oc-preview"></div>
            <div class="upload-cta">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <div>
                <strong>Anexar foto</strong>
                <small>arraste, cole ou clique para escolher (até 8MB)</small>
              </div>
            </div>
            <input id="oc-file" type="file" accept="image/*" capture="environment" hidden />
          </div>
          <div class="upload-status" id="oc-upload-status"></div>
          <details class="upload-fallback">
            <summary>ou cole uma URL</summary>
            <input id="oc-photo" type="url" placeholder="https://..." />
          </details>
        </div>
        <div class="field">
          <label for="oc-cep">CEP (opcional)</label>
          <input id="oc-cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000" />
          <div class="hint" id="oc-cep-hint">se vazio, usa o CEP do seu cadastro</div>
        </div>
        <div class="actions">
          <button type="button" class="btn secondary" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn" id="btn-save">Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/feed.js"></script>
  <script type="module" src="js/pwa.js"></script>
</body>
</html>

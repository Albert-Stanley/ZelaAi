<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0f9d58" />
  <title>ZelaAi — Feed</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />
</head>
<body>
  <!-- HEADER full width -->
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">Z</span>
        <span>ZelaAi</span>
      </a>
      <nav class="nav-links">
        <a href="mandates.html" id="mand-link">Termômetro</a>
        <a href="my.html" id="my-link">Minhas</a>
      </nav>
      <div>
        <span class="user-tag" id="user-tag">…</span>
        <a class="logout" href="#" id="logout-link">sair</a>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="content">

      <div class="map-wrap">
        <div id="map"></div>
      </div>

      <div class="search-bar">
        <input id="search" type="search" placeholder="Buscar por título, descrição, cidade ou CEP..." />
      </div>

      <div class="feed-header">
        <h2>Ocorrências</h2>
        <span class="count" id="count">—</span>
      </div>

      <div id="feed">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </main>

  <button class="fab" id="fab-new" aria-label="Nova ocorrência">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
  </button>

  <!-- Modal de criação -->
  <div class="modal-bg" id="modal-bg">
    <div class="modal">
      <h2>Nova ocorrência</h2>
      <p class="modal-sub">Conte o que está rolando no seu bairro.</p>
      <form id="form-new">
        <div class="field">
          <label for="oc-category">Categoria</label>
          <select id="oc-category" required></select>
        </div>
        <div class="field">
          <label for="oc-title">Título</label>
          <input id="oc-title" type="text" required maxlength="150" placeholder="Ex: Buraco enorme na Av. Brasil" />
        </div>
        <div class="field">
          <label for="oc-desc">Descrição</label>
          <textarea id="oc-desc" required maxlength="2000" placeholder="Descreva o problema com detalhes…"></textarea>
        </div>
        <div class="field">
          <label for="oc-photo">URL da foto</label>
          <input id="oc-photo" type="url" required placeholder="https://..." />
          <div class="hint">cole o link de uma foto (Imgur, Cloudinary etc.)</div>
        </div>
        <div class="field">
          <label for="oc-cep">CEP (opcional)</label>
          <input id="oc-cep" type="text" inputmode="numeric" maxlength="8" placeholder="00000000" />
          <div class="hint">se vazio, usa o CEP do seu cadastro</div>
        </div>
        <div class="actions">
          <button type="button" class="btn secondary" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn" id="btn-save">Publicar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script type="module" src="js/feed.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3a28"/>
      <stop offset="100%" stop-color="#0a1612"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3a0"/>
      <stop offset="100%" stop-color="#0f9d58"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#22d3a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3a0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- logo mark -->
  <g transform="translate(80, 80)">
    <rect width="96" height="96" rx="22" fill="url(#brand)"/>
    <path d="M30 32 L66 32 L36 64 L66 64" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="120" y="68" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="white" letter-spacing="-2">ZelaAi</text>
  </g>
  <!-- title -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="800" fill="white" letter-spacing="-3">Sua cidade,</text>
  <text x="80" y="412" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="800" fill="url(#brand)" letter-spacing="-3">sua voz.</text>
  <!-- subtitle -->
  <text x="80" y="478" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#a4b8b0">Reporte problemas urbanos. Vote no que importa.</text>
  <text x="80" y="518" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#a4b8b0">Acompanhe gestões em tempo real.</text>
  <!-- footer pill -->
  <g transform="translate(80, 562)">
    <rect width="280" height="44" rx="22" fill="#22d3a0" fill-opacity="0.14" stroke="#22d3a0" stroke-width="1.5"/>
    <text x="24" y="29" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#22d3a0">🟢 Open source · Haskell + Vanilla JS</text>
  </g>
</svg>

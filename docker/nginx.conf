# Nginx config para servir o front estático do ZelaAi
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # esconde versão do nginx
  server_tokens off;

  # gzip
  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # Security headers (aplicados em todas as respostas)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  # CSP em UMA linha (nginx não junta linhas separadas por '\' dentro de
  # diretivas — o navegador recebe o cabeçalho cortado no primeiro '\').
  # Permite Leaflet/Chart.js (unpkg/jsdelivr), Google Fonts, Cloudinary,
  # APIs em http(s)/ws(s) — incluindo localhost pra dev local.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; style-src-elem 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http: ws: wss: http://localhost:* http://127.0.0.1:*; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
  # HSTS — só ativar quando o domínio estiver 100% em HTTPS.
  # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # SPA-ish fallback (ainda que sejam páginas separadas)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # cache pesado pra assets versionáveis
  location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  # robots/sitemap servidos com Cache-Control curto
  location ~* /(robots\.txt|sitemap\.xml)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }

  # 404 customizado
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
